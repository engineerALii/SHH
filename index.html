<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 | شهد</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;400;600;700&family=Zen+Tokyo+Zoo&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --accent: #d4af37; /* Royal Gold */
            --bg-dark: #050505;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Readex Pro', sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px; /* For 3D effects */
        }

        /* Background Canvas */
        #aurora-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            filter: blur(40px) brightness(0.7);
            opacity: 0.6;
        }

        /* Noise Overlay for texture */
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* Main Container */
        .luxury-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 3rem 2rem;
            box-shadow: 
                0 0 0 1px rgba(0,0,0, 0.5),
                0 20px 50px -10px rgba(0,0,0, 0.8),
                inset 0 0 20px rgba(255,255,255, 0.02);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            overflow: hidden;
        }

        /* Glowing Border Animation */
        .luxury-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            z-index: -1;
            background: linear-gradient(45deg, transparent, rgba(212, 175, 55, 0.3), transparent);
            border-radius: 30px;
            animation: border-flow 4s linear infinite;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .luxury-card:hover::before { opacity: 1; }

        @keyframes border-flow {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Typography & Effects */
        .gold-text {
            background: linear-gradient(to bottom, #fff 20%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .hero-year {
            font-family: 'Zen Tokyo Zoo', cursive; /* Unique font for the year */
            font-size: 6rem;
            line-height: 0.8;
            letter-spacing: 4px;
            background: linear-gradient(180deg, #ffffff 0%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.2));
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 2.5rem 0;
            position: relative;
        }

        /* Elegant dividers */
        .countdown-grid::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 20%;
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-val {
            font-size: 2.2rem;
            font-weight: 200;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
        }

        .time-label {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: #d4af37;
            text-transform: uppercase;
            opacity: 0.8;
            margin-top: 5px;
        }

        /* Action Button */
        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 1.2rem;
            border-radius: 16px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .action-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }

        .action-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
        }
        
        .action-btn:hover::after { transform: translateX(100%); }

        /* Shahad Name Reveal - Fixed Clipping */
        .shahad-reveal {
            font-size: clamp(3rem, 12vw, 5rem); /* Responsive font size */
            font-weight: 800;
            line-height: 1.5; /* Increased to fix vertical clipping */
            margin: 1rem 0;
            padding: 0 10px; /* Added padding to prevent side clipping */
            background: linear-gradient(45deg, #d4af37, #fef9e3, #d4af37);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            transform: scale(0.9);
            opacity: 0;
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-block; /* Ensure better rendering */
        }

        .shahad-reveal.visible {
            transform: scale(1);
            opacity: 1;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Utility */
        .hidden { display: none; }
        .fade-in { animation: fadeIn 1s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Music Bars */
        .music-bars { display: flex; gap: 2px; height: 12px; align-items: flex-end; }
        .music-bar { width: 2px; background: #d4af37; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { height: 20%; } 50% { height: 100%; } }

    </style>
</head>
<body>

    <!-- Dynamic Background -->
    <canvas id="aurora-canvas"></canvas>
    <div class="noise-overlay"></div>

    <!-- Status Bar -->
    <div class="fixed top-6 w-full px-6 flex justify-between items-center z-50 pointer-events-none">
        <div class="flex items-center gap-2 bg-black/30 backdrop-blur-md px-3 py-1 rounded-full border border-white/5 pointer-events-auto">
            <div id="connection-dot" class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></div>
            <span class="text-[9px] font-medium tracking-widest text-emerald-500/80">ONLINE</span>
        </div>
        
        <button id="sound-btn" class="bg-black/30 backdrop-blur-md p-2 rounded-full border border-white/5 pointer-events-auto transition active:scale-90 hover:bg-white/10">
            <div id="visualizer" class="music-bars opacity-50">
                <div class="music-bar" style="animation-delay: 0s"></div>
                <div class="music-bar" style="animation-delay: 0.2s"></div>
                <div class="music-bar" style="animation-delay: 0.4s"></div>
            </div>
        </button>
    </div>

    <!-- Main Card Container -->
    <main id="card-container" class="luxury-card">
        
        <!-- Countdown View -->
        <div id="view-countdown" class="flex flex-col items-center text-center fade-in">
            <div class="hero-year">2026</div>
            <p class="text-xs font-light tracking-[0.3em] text-gray-400 uppercase">The Beginning of Forever</p>

            <div class="countdown-grid w-full">
                <div class="time-box">
                    <span id="d" class="time-val">00</span>
                    <span class="time-label">يوم</span>
                </div>
                <div class="time-box">
                    <span id="h" class="time-val">00</span>
                    <span class="time-label">ساعة</span>
                </div>
                <div class="time-box">
                    <span id="m" class="time-val">00</span>
                    <span class="time-label">دقيقة</span>
                </div>
                <div class="time-box">
                    <span id="s" class="time-val">00</span>
                    <span class="time-label">ثانية</span>
                </div>
            </div>

            <p class="text-[10px] text-gray-500 font-light mt-4 mb-8 leading-relaxed max-w-[80%]">
                لحظات تفصلنا عن عام جديد، وعالم جديد بانتظارك.
            </p>

            <button id="btn-enter" class="action-btn group">
                <span class="relative z-10 flex items-center justify-center gap-2">
                    دخول عالم شهد <i data-lucide="sparkles" class="w-4 h-4"></i>
                </span>
            </button>
        </div>

        <!-- Celebration View -->
        <div id="view-celebration" class="hidden flex-col items-center text-center">
            <div class="w-full flex justify-center mb-4">
                <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-amber-300 to-yellow-600 flex items-center justify-center shadow-lg shadow-amber-500/20">
                    <i data-lucide="crown" class="w-6 h-6 text-white"></i>
                </div>
            </div>
            
            <h2 class="text-lg font-light text-gray-300 tracking-wide mb-2">عام سعيد لأجمل</h2>
            
            <div class="relative w-full flex justify-center">
                <!-- Glowing Aura behind name -->
                <div class="absolute inset-0 bg-amber-500/20 blur-[40px] rounded-full transform scale-150"></div>
                <span id="name-element" class="shahad-reveal relative z-10 block">شهد</span>
            </div>

            <p class="text-sm font-light text-gray-300 leading-7 mt-6 mb-8 px-2 border-l-2 border-amber-500/30 pl-4 text-right">
                "في كل عام، أنتِ الاستثناء الجميل، والتفصيل الأغلى. دمتِ نوراً لا يغيب، وفرحاً يتجدد مع كل ثانية."
            </p>

            <button id="btn-celebrate" class="action-btn">
                <span class="relative z-10">إطلاق الاحتفال الكبير ✨</span>
            </button>
        </div>

    </main>

    <footer class="fixed bottom-6 text-[8px] text-white/10 tracking-[0.5em] uppercase">
        Designed for Shahad • 2026 Edition
    </footer>

    <audio id="bg-audio" src="ali.mp3" autoplay loop></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        lucide.createIcons();

        // --- Background Animation (Aurora) ---
        const canvas = document.getElementById('aurora-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, t = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawAurora() {
            ctx.clearRect(0, 0, width, height);
            // Create a dynamic gradient mesh
            const g = ctx.createLinearGradient(0, 0, width, height);
            g.addColorStop(0, '#050505');
            g.addColorStop(0.5, '#0a0a1a');
            g.addColorStop(1, '#000000');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, width, height);

            // Draw glowing orbs
            for(let i=0; i<3; i++) {
                const x = width/2 + Math.sin(t*0.001 + i) * width * 0.4;
                const y = height/2 + Math.cos(t*0.0015 + i) * height * 0.3;
                const r = width * 0.4;
                
                const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad.addColorStop(0, `hsla(${200 + i*40}, 60%, 20%, 0.15)`);
                grad.addColorStop(1, 'transparent');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI*2);
                ctx.fill();
            }
            t += 5;
            requestAnimationFrame(drawAurora);
        }
        drawAurora();

        // --- Tilt Effect (Parallax) ---
        const card = document.getElementById('card-container');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // --- Logic & Firebase ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyD6MRZ7d7J1333erYoBrUGqocJNdGNjB7w",
            authDomain: "neew-aec2b.firebaseapp.com",
            databaseURL: "https://neew-aec2b-default-rtdb.firebaseio.com",
            projectId: "neew-aec2b",
            storageBucket: "neew-aec2b.firebasestorage.app",
            messagingSenderId: "70112873200",
            appId: "1:70112873200:web:b8ef2b3863be6f1bf39035"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sh-lux-26';
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'celebrations', 'global');

        // Audio
        const audio = document.getElementById('bg-audio');
        const visualizer = document.getElementById('visualizer');
        
        const playAudio = async () => {
            try {
                await audio.play();
                visualizer.style.opacity = '1';
            } catch(e) { console.log('Audio wait'); }
        };

        document.getElementById('sound-btn').addEventListener('click', () => {
            if(audio.paused) playAudio();
            else { audio.pause(); visualizer.style.opacity = '0.3'; }
        });

        // Auth
        let user = null;
        let lastTime = 0;

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try { await signInWithCustomToken(auth, __initial_auth_token); }
                    catch(e) { await signInAnonymously(auth); }
                } else await signInAnonymously(auth);
            } catch(e) { console.error(e); }
        };

        onAuthStateChanged(auth, (u) => {
            user = u;
            if(u) listen();
        });
        initAuth();

        function listen() {
            if(!user) return;
            onSnapshot(docRef, (snap) => {
                if(snap.exists()) {
                    const d = snap.data();
                    if(d.t && d.t.toMillis() > lastTime) {
                        lastTime = d.t.toMillis();
                        if(Date.now() - lastTime < 8000) fireConfetti();
                    }
                } else setDoc(docRef, { t: null });
            });
        }

        async function trigger() {
            if(!user) return;
            fireConfetti();
            lastTime = Date.now();
            playAudio();
            try { await updateDoc(docRef, { t: serverTimestamp(), by: user.uid }); }
            catch(e) { await setDoc(docRef, { t: serverTimestamp(), by: user.uid }); }
        }

        // View Transitions
        document.getElementById('btn-enter').addEventListener('click', () => {
            playAudio();
            const v1 = document.getElementById('view-countdown');
            const v2 = document.getElementById('view-celebration');
            
            v1.style.opacity = '0';
            setTimeout(() => {
                v1.classList.add('hidden');
                v2.classList.remove('hidden');
                v2.classList.add('fade-in');
                v2.style.display = 'flex'; // Ensure flex layout
                
                // Animate Name
                setTimeout(() => {
                    document.getElementById('name-element').classList.add('visible');
                }, 300);
            }, 500);
        });

        document.getElementById('btn-celebrate').addEventListener('click', trigger);

        // Firework Logic (High Detail)
        function fireConfetti() {
            const end = Date.now() + 3000;
            const colors = ['#d4af37', '#fef9e3', '#ffffff', '#b8860b'];

            (function frame() {
                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 80,
                    origin: { x: 0, y: 0.7 },
                    colors: colors,
                    shapes: ['circle'],
                    scalar: 0.8,
                    drift: 0.5
                });
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 80,
                    origin: { x: 1, y: 0.7 },
                    colors: colors,
                    shapes: ['circle'],
                    scalar: 0.8,
                    drift: -0.5
                });

                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        // Timer
        const target = new Date("Jan 1, 2026 00:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const dist = target - now;
            
            const d = Math.floor(dist / (1000 * 60 * 60 * 24));
            const h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((dist % (1000 * 60)) / 1000);

            document.getElementById('d').innerText = d < 10 ? '0'+d : d;
            document.getElementById('h').innerText = h < 10 ? '0'+h : h;
            document.getElementById('m').innerText = m < 10 ? '0'+m : m;
            document.getElementById('s').innerText = s < 10 ? '0'+s : s;
        }, 1000);

    </script>
</body>
</html>
