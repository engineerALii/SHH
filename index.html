<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>2026 | شهد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --ios-bg: #000000;
            --ios-accent: #a78bfa;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body {
            font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--ios-bg);
            color: #ffffff;
            /* استخدام dvh لضمان التمركز الصحيح مع شريط العنوان في الجوال */
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        /* تأثير الزجاج العميق لنظام iOS */
        .ios-glass {
            background: rgba(28, 28, 30, 0.6);
            backdrop-filter: saturate(180%) blur(25px);
            -webkit-backdrop-filter: saturate(180%) blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ios-card {
            border-radius: 42px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 380px;
            margin: auto;
        }

        /* تأثير ألوان قوس قزح المتوهج */
        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .name-rainbow {
            background: linear-gradient(270deg, #ff0080, #7928ca, #4299e1, #48bb78, #ecc94b, #ed8936, #ff0080);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 6s ease infinite;
            filter: drop-shadow(0 0 10px rgba(167, 139, 250, 0.3));
        }

        .ios-btn {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s;
        }
        .ios-btn:active {
            transform: scale(0.94);
            opacity: 0.8;
        }

        #star-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
        }

        .ui-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: var(--safe-top) 20px var(--safe-bottom) 20px;
        }

        /* محلل الصوت */
        .bar {
            width: 3px;
            background: var(--ios-accent);
            border-radius: 10px;
            animation: visualize 1.2s ease-in-out infinite;
        }
        @keyframes visualize {
            0%, 100% { height: 4px; }
            50% { height: 14px; }
        }

        /* أنيميشن الانتقال */
        .fade-exit { opacity: 0; transform: scale(0.95); transition: all 0.5s ease-in; }
        .fade-enter { opacity: 0; transform: translateY(20px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="star-canvas"></canvas>

    <div class="ui-container">
        
        <!-- الهيدر (أعلى المركز) -->
        <header class="flex flex-col items-center gap-4 mt-8">
            <div class="flex items-center gap-2 ios-glass px-4 py-1.5 rounded-full">
                <div id="status-dot" class="w-2 h-2 bg-yellow-500 rounded-full animate-pulse"></div>
                <span id="status-text" class="text-[9px] font-bold tracking-widest opacity-60 uppercase">Connecting</span>
            </div>
            
            <div id="music-control" class="ios-glass p-3 rounded-2xl ios-btn cursor-pointer flex items-center gap-3">
                <div id="visualizer" class="hidden items-end gap-0.5 h-4">
                    <div class="bar" style="animation-delay: 0.1s"></div>
                    <div class="bar" style="animation-delay: 0.3s"></div>
                    <div class="bar" style="animation-delay: 0.2s"></div>
                </div>
                <span class="text-[10px] font-semibold text-purple-200">صوت الأمل</span>
                <i data-lucide="music" class="w-3.5 h-3.5 text-purple-400"></i>
            </div>
        </header>

        <!-- المحتوى المركزي (البطاقة) -->
        <main class="flex-grow flex items-center justify-center w-full">
            
            <!-- بطاقة العداد -->
            <div id="countdown-card" class="ios-glass ios-card p-10 flex flex-col items-center text-center">
                <h1 class="text-7xl font-bold mb-1 tracking-tighter text-white">2026</h1>
                <p class="text-purple-300/50 text-[9px] font-bold tracking-[0.4em] uppercase mb-10">Waiting for Magic</p>

                <div class="grid grid-cols-4 gap-4 w-full mb-12">
                    <div class="flex flex-col">
                        <span id="days" class="text-3xl font-bold">00</span>
                        <span class="text-[8px] font-bold opacity-30 uppercase mt-1">يوم</span>
                    </div>
                    <div class="flex flex-col">
                        <span id="hours" class="text-3xl font-bold">00</span>
                        <span class="text-[8px] font-bold opacity-30 uppercase mt-1">ساعة</span>
                    </div>
                    <div class="flex flex-col">
                        <span id="minutes" class="text-3xl font-bold">00</span>
                        <span class="text-[8px] font-bold opacity-30 uppercase mt-1">دقيقة</span>
                    </div>
                    <div class="flex flex-col">
                        <span id="seconds" class="text-3xl font-bold">00</span>
                        <span class="text-[8px] font-bold opacity-30 uppercase mt-1">ثانية</span>
                    </div>
                </div>

                <button id="preview-btn" class="w-full bg-white text-black py-5 rounded-[2rem] font-bold text-xs ios-btn shadow-2xl">
                    استكشاف عالم شهد ✨
                </button>
            </div>

            <!-- بطاقة المعايدة -->
            <div id="celebration-card" class="hidden ios-glass ios-card p-10 flex flex-col items-center text-center fade-enter">
                <span class="text-purple-400 text-[9px] font-black tracking-[0.3em] uppercase mb-6">Celestial Greeting</span>
                <h2 class="text-4xl font-bold mb-8 leading-tight text-white">
                    كل عام وأنتِ <br>بخير يا <br>
                    <span id="shahad-name" class="text-6xl block mt-4">شهد</span>
                </h2>
                
                <p class="text-slate-300 font-light leading-relaxed mb-10 text-base italic px-2">
                    "مع أول نبض في 2026، أردتُ أن أخبركِ أنكِ أجمل أقداري.. دمتِ لي حباً لا ينتهي."
                </p>

                <button id="global-celebrate-btn" class="w-full bg-gradient-to-r from-purple-600 to-pink-500 text-white py-5 rounded-[2rem] font-bold ios-btn shadow-[0_15px_40px_rgba(167,139,250,0.4)]">
                    انقري للاحتفال ✨
                </button>
            </div>

        </main>

        <!-- الفوتر -->
        <footer class="text-center py-6 opacity-20">
            <p class="text-[7px] uppercase tracking-[0.7em]">iOS Ecosystem • Shahad 2026</p>
        </footer>

    </div>

    <!-- ملف الصوت -->
    <audio id="bg-music" loop src="ali.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        lucide.createIcons();

        // تهيئة Firebase
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sh-ios-v3';
        const celebrationDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'celebrations', 'global');

        // إدارة الصوت
        const bgMusic = document.getElementById('bg-music');
        const visualizer = document.getElementById('visualizer');
        
        const playMusic = async () => {
            try {
                await bgMusic.play();
                visualizer.classList.replace('hidden', 'flex');
            } catch (err) {
                console.log("Audio not found");
                visualizer.classList.replace('flex', 'hidden');
            }
        };

        document.getElementById('music-control').addEventListener('click', () => {
            if (bgMusic.paused) playMusic();
            else {
                bgMusic.pause();
                visualizer.classList.replace('flex', 'hidden');
            }
        });

        // المصادقة والمزامنة
        let user = null;
        let lastTriggerTime = 0;

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                document.getElementById('status-text').innerText = "OFFLINE";
                document.getElementById('status-dot').style.backgroundColor = "#ef4444";
            }
        };

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                document.getElementById('status-text').innerText = "CONNECTED";
                document.getElementById('status-dot').style.backgroundColor = "#22c55e";
                startSyncListener();
            }
        });

        initAuth();

        function startSyncListener() {
            if (!user) return;
            onSnapshot(celebrationDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.triggerTime) {
                        const triggerMs = data.triggerTime.toMillis();
                        if (triggerMs > lastTriggerTime) {
                            lastTriggerTime = triggerMs;
                            if (Date.now() - triggerMs < 5000) triggerVisualCelebration();
                        }
                    }
                } else {
                    setDoc(celebrationDocRef, { triggerTime: null }).catch(() => {});
                }
            });
        }

        async function triggerGlobalCelebration() {
            if (!user) return;
            triggerVisualCelebration();
            lastTriggerTime = Date.now();
            playMusic();
            try {
                await updateDoc(celebrationDocRef, { triggerTime: serverTimestamp(), triggeredBy: user.uid });
            } catch (e) {
                await setDoc(celebrationDocRef, { triggerTime: serverTimestamp(), triggeredBy: user.uid });
            }
        }

        // العداد
        const targetDate = new Date("January 1, 2026 00:00:00").getTime();
        const timer = setInterval(() => {
            const dist = targetDate - new Date().getTime();
            const d = Math.floor(dist / (1000 * 60 * 60 * 24));
            const h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((dist % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d < 10 ? "0"+d : d;
            document.getElementById("hours").innerText = h < 10 ? "0"+h : h;
            document.getElementById("minutes").innerText = m < 10 ? "0"+m : m;
            document.getElementById("seconds").innerText = s < 10 ? "0"+s : s;

            if (dist < 0) {
                clearInterval(timer);
                transitionToCelebration();
            }
        }, 1000);

        function transitionToCelebration() {
            const countdown = document.getElementById('countdown-card');
            const celebration = document.getElementById('celebration-card');
            if (countdown.classList.contains('hidden')) return;

            countdown.classList.add('fade-exit');
            setTimeout(() => {
                countdown.classList.add('hidden');
                celebration.classList.remove('hidden');
                setTimeout(() => celebration.classList.add('fade-enter-active'), 50);
            }, 500);
        }

        function triggerVisualCelebration() {
            document.getElementById('shahad-name').classList.add('name-rainbow');
            const duration = 3 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 2, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#a78bfa', '#f472b6', '#ffffff'], scalar: 0.6 });
                confetti({ particleCount: 2, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#a78bfa', '#f472b6', '#ffffff'], scalar: 0.6 });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        // خلفية النجوم
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = Array.from({ length: 100 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 1.5,
                s: Math.random() * 0.2 + 0.1,
                o: Math.random()
            }));
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.fillStyle = `rgba(255, 255, 255, ${p.o})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
                p.y += p.s; if (p.y > canvas.height) p.y = -5;
            });
            requestAnimationFrame(drawStars);
        }

        document.getElementById('preview-btn').addEventListener('click', () => {
            transitionToCelebration();
            playMusic();
        });
        document.getElementById('global-celebrate-btn').addEventListener('click', triggerGlobalCelebration);

        window.addEventListener('resize', initStars);
        initStars();
        drawStars();
    </script>
</body>
</html>
